name: Build, validate and deploy ONTOS.RENT
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/configure-pages@v5
      - name: Install compiler dependency
        run: python -m pip install -r requirements-site.txt
      - name: Check link graph targets
        run: python scripts/link_audit.py --report _audit/links.json
      - name: Check syntax and canonical contracts
        run: |
          python -m compileall -q scripts tests
          python -m unittest discover -s tests -v
      - name: Build canonical static site
        run: |
          python scripts/site_core.py --output _site
          touch _site/.nojekyll
      - name: Publish complete model-authored question and response titles
        run: python scripts/apply_authored_titles.py --site _site
      - name: Publish instrument-fund favicon on all pages
        run: python scripts/install_favicon.py --site _site
      - name: Install invisible Yandex Metrika counter
        run: python scripts/install_metrika.py --site _site
      - name: Publish IndexNow verification key
        run: |
          key="$(tr -d '\r\n' < content/indexnow-key.txt)"
          cp content/indexnow-key.txt "_site/$key.txt"
      - name: Validate complete published artifact
        run: python scripts/validate_site.py --site _site
      - name: Verify Yandex Metrika covers all live HTML documents
        run: python scripts/install_metrika.py --site _site --check
      - name: Verify model-authored titles were published literally
        run: python scripts/apply_authored_titles.py --site _site --check
      - name: Verify favicon markup and icon assets
        run: python scripts/install_favicon.py --site _site --check
      - name: Track functional-title progress across the complete corpus
        run: |
          python scripts/title_worklist.py --site _site --report _audit/build.json --output _audit/title-worklist.json --csv _audit/title-worklist.csv
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("_audit/title-worklist.json").read_text(encoding="utf-8"))
          remaining = [record for record in report["records"] if record["role"] == "n0" and record["review_state"] == "pending_functional_review"]
          print("BEGIN_PENDING_EDITORIAL_SLUGS")
          for record in remaining:
              print(f'{record["slug"]} | {record["topic_source"]}')
          print(f'END_PENDING_EDITORIAL_SLUGS total={len(remaining)}')
          PY
      - name: Audit page roles and rental language
        run: python scripts/page_contract_audit.py --site _site --report _audit/page-contract.json
      - name: Save release audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-audit
          path: _audit/
          retention-days: 14
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy validated artifact
        id: deployment
        uses: actions/deploy-pages@v5
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Notify Yandex about this site-wide update via IndexNow
        continue-on-error: true
        run: python scripts/submit_indexnow.py
