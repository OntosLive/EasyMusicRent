name: Build, validate and deploy ONTOS.RENT
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/configure-pages@v5
      - name: Install compiler dependency
        run: python -m pip install -r requirements-site.txt
      - name: Check syntax and canonical contracts
        run: |
          python -m compileall -q scripts tests
          python -m unittest discover -s tests -v
      - name: Build canonical static site
        run: |
          python scripts/site_core.py --output _site
          touch _site/.nojekyll
      - name: Validate complete published artifact
        run: python scripts/validate_site.py --site _site
      - name: Save release audit
        uses: actions/upload-artifact@v4
        with:
          name: release-audit
          path: _audit/
          retention-days: 14
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy validated artifact
        id: deployment
        uses: actions/deploy-pages@v5
