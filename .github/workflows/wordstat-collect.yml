name: Collect Wordstat queries

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect Wordstat data
        env:
          YANDEX_WORDSTAT_API_KEY: ${{ secrets.YANDEX_WORDSTAT_API_KEY }}
          YANDEX_FOLDER_ID: ${{ secrets.YANDEX_FOLDER_ID }}
        run: python tools/wordstat_collect.py

      - name: Commit updated candidates
        run: |
          if [ -z "$(git status --porcelain -- data/generated_seeds.csv data/wordstat_raw.csv data/query_candidates.csv)" ]; then
            echo "No changes"
            exit 0
          fi

          git config user.name "Ontos.Wordstat"
          git config user.email "ai@ontos.live"
          git add data/generated_seeds.csv data/wordstat_raw.csv data/query_candidates.csv
          git commit -m "Update Wordstat query candidates"
          git pull --rebase origin main
          git push
