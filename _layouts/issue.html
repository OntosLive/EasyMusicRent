<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <title>{{ page.title }} · COMPASS.RENT</title>
  <link rel="stylesheet" href="{{ site.baseurl }}/styles.css">
</head>
<body>
  <header class="masthead">
    <div class="rule"></div>
    <div class="meta">
      <span>{{ page.date_label | default: "28 СЕНТЯБРЯ 2026" }}</span>
      <span>{{ page.edition | default: "ВЫПУСК" }}</span>
      <span>№ {{ page.number }}</span>
    </div>
    <h1><a href="{{ site.baseurl }}/" style="color:inherit;text-decoration:none">COMPASS<span>.</span>RENT</a></h1>
    <p class="tagline">Газета аренды · Сегодня утюг. Завтра что угодно.</p>
    <div class="rule heavy"></div>
  </header>

  <main>
    <article class="lead issue-body">
      {{ content }}
    </article>

    <p style="margin:40px 0 0;font:700 11px Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase">
      <a href="{{ site.baseurl }}/archive/" style="color:inherit">← Подшивка COMPASS.RENT</a>
    </p>
  </main>

  <footer>
    <span>COMPASS.RENT · № {{ page.number }}</span>
    <span>Сигнал остаётся в эфире.</span>
  </footer>
</body>
</html>
